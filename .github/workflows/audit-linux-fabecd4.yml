# Throwaway audit harness: measure the README headline numbers on Linux at the IMMUTABLE reference
# commit fabecd4. This branch contains only this file; the job checks out fabecd4 itself, verifies the
# SHA, and runs its unmodified code on the pinned, sha256-checked data (same inputs as audit/reproduce.sh).
name: audit-linux-fabecd4
on:
  push:
  workflow_dispatch:
env:
  REF: fabecd4736461a216d974fff8cc8266e6b50f9f9
  RJ: https://raw.githubusercontent.com/martj42/international_results/ff2a795faf5e2a94f3c72717db932d90368ea5bc
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fabecd4736461a216d974fff8cc8266e6b50f9f9
      - name: Verify the checked-out tree is exactly the reference commit
        run: |
          test "$(git rev-parse HEAD)" = "$REF"
          test -z "$(git status --porcelain)"
          echo "AUDIT HEAD=$(git rev-parse HEAD)"
          echo "AUDIT CPU=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (locked subset, same as audit/reproduce.sh)
        run: |
          pip install numpy==2.4.2 scipy==1.17.0 pandas==2.3.3
          pip install -e . --no-deps
          pip freeze
      - name: Pinned, hash-checked data in fabecd4's own data paths
        run: |
          mkdir -p data/raw/odds
          curl -sSfL -o data/raw/results.csv   "$RJ/results.csv"
          curl -sSfL -o data/raw/shootouts.csv "$RJ/shootouts.csv"
          for lg in E0 D1 SP1 I1 F1; do for s in 2122 2223 2324; do
            curl -sSfL -o "data/raw/odds/${lg}_${s}.csv" "https://www.football-data.co.uk/mmz4281/${s}/${lg}.csv"
          done; done
          cat > /tmp/sums <<'SUMS'
          27d2d19b259d30b36f70a34f3f0e0f54ff3b7c90776de7c24659fb925c7d9992  data/raw/results.csv
          cd66ba9cf02032ef2c5fa93717ade300f0e4161aa1a3d2c5dba5eee989acc9de  data/raw/shootouts.csv
          034d0e1296e944dddf25e3c91b85ef5bd1ad25661b89d73878f5c73bfea4b9fc  data/raw/odds/D1_2122.csv
          b716517b25033ce8e0243e967aa961876425a4c41e97c8aa8fa59f2aca061341  data/raw/odds/D1_2223.csv
          1de8bc12a133dbbf71bc6ffda62082642f087f61b1b7c15ae9f2d320876fb07e  data/raw/odds/D1_2324.csv
          335afcbabeb2939fa10ab39ba3e8215072d0b577cb8d0705c1e44c56e934e703  data/raw/odds/E0_2122.csv
          8442792d3b614c94ea3cf381bd2736805889cc1713169035368fff19c3d02380  data/raw/odds/E0_2223.csv
          b2e057b0ed959f198b0f63d2391c01239f3608e6de5db68edab3f88e04d07ff3  data/raw/odds/E0_2324.csv
          9e9eaefb8704264f8d55a718a119d940de4af7d7b4217ac4097b957406e16213  data/raw/odds/F1_2122.csv
          18ea07d922e8b6360b81189637efd5aaf44779765db856bff208d5b1acf69b2f  data/raw/odds/F1_2223.csv
          ca0a4bf51d5b1ccfd0e1558ea41de6bb829df6c96c759888a87248d296d5adb7  data/raw/odds/F1_2324.csv
          6a9555d5a90e652a883fd2862a52545c06e264016cd770347c067a6d7c993170  data/raw/odds/I1_2122.csv
          9960837f37a97ae700f876c87b85a8b7a2f5a5d05a53077830c21b9db8880c45  data/raw/odds/I1_2223.csv
          343a89db026fe4204ebeabd663cdfee8d02a45457828fc1cb63fa630ca170723  data/raw/odds/I1_2324.csv
          2d9e619700712823d15716c07715133f8c3b1a09046930dcfc785a38633dee2e  data/raw/odds/SP1_2122.csv
          53348112526b5165539df240be350083989bb258f30c0ff7cacbc0165ca7e4b3  data/raw/odds/SP1_2223.csv
          5323f596c7ed318e4bce95557a369d809d98501fa499ea5f41350cd45cf3c7d9  data/raw/odds/SP1_2324.csv
          SUMS
          sed -i 's/^[[:space:]]*//' /tmp/sums
          sha256sum -c /tmp/sums
      - name: Headline commands (unmodified fabecd4 code)
        env:
          PYTHONPATH: src
        run: |
          python cli.py backtest | sed 's/^/AUDIT backtest | /'
          python cli.py probe | grep -E "overall " | sed 's/^/AUDIT probe | /'
          python cli.py stage-reliability | sed 's/^/AUDIT stage | /'
          python cli.py validate | grep -E "RPS" | sed 's/^/AUDIT validate | /'
